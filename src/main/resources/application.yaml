spring:
  application:
    name: urlPrefirmadas
  datasource:
    url: jdbc:postgresql://localhost:5432/basedatos_poc
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

gcp:
  storage:
    # En GCP se detecta automáticamente; en local define GOOGLE_CLOUD_PROJECT.
    project-id: ${GOOGLE_CLOUD_PROJECT}
    bucket-name: ${GCS_BUCKET_NAME}

recaptcha:
  enterprise:
    base-url: https://recaptchaenterprise.googleapis.com
    api-key: ${RECAPTCHA_API_KEY}
    site-key: ${RECAPTCHA_SITE_KEY:6LfbgsMtAAAAAKBnPVllt4_PAvTu6EFp5VhYenMk}
    expected-action: 'DOWNLOAD_FILE'
    minimum-score: ${RECAPTCHA_MINIMUM_SCORE:0.5}

