<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabla ArchivosHash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4"><h1>Tabla JPA: ArchivosHash</h1><a class="btn btn-outline-primary" th:href="@{/archivos}">Volver</a></div>
    <div class="card shadow-sm overflow-hidden"><div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
            <thead class="table-dark"><tr><th>token_uid</th><th>carpeta</th><th>archivo</th><th>ban_activo</th></tr></thead>
            <tbody>
            <tr th:each="item : ${archivos}"><td class="font-monospace" th:text="${item.tokenUid}"></td><td th:text="${item.carpeta}"></td><td th:text="${item.archivo}"></td><td th:text="${item.banActivo}"></td></tr>
            <tr th:if="${#lists.isEmpty(archivos)}"><td class="text-center text-secondary py-4" colspan="4">La tabla no contiene registros.</td></tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
