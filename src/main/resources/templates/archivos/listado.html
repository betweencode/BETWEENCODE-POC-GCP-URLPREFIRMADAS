<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="mb-1">Archivos</h1><p class="text-secondary mb-0">Registros guardados en la base de datos</p></div>
        <a class="btn btn-outline-secondary" th:href="@{/archivos/tabla}">Ver tabla JPA</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <section class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Subir un archivo</h2>
            <form class="row g-3" th:action="@{/archivos/subir}" method="post" enctype="multipart/form-data">
                <div class="col-md-4"><label class="form-label" for="carpeta">Carpeta</label><input class="form-control" id="carpeta" name="carpeta" placeholder="ej. documentos/2026"></div>
                <div class="col-md-6"><label class="form-label" for="archivo">Archivo</label><input class="form-control" id="archivo" name="archivo" type="file" required></div>
                <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Subir archivo</button></div>
            </form>
        </div>
    </section>

    <section class="card shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th>Archivo</th><th>Carpeta</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="item : ${archivos}" th:with="link=${servidor + '/' + item.tokenUid}">
                    <td class="fw-semibold" th:text="${item.archivo}">archivo.pdf</td>
                    <td th:text="${item.carpeta}">documentos</td>
                    <td><span class="badge" th:classappend="${item.banActivo} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${item.banActivo} ? 'Activo' : 'Inactivo'">Activo</span></td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-sm btn-outline-primary copiar-link" type="button" th:attr="data-link=${link}">Copiar link</button>
                        <a class="btn btn-sm btn-primary" target="_blank" rel="noopener" th:href="${link}">Abrir directo</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(archivos)}"><td class="text-center text-secondary py-4" colspan="4">No hay archivos registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script>
document.querySelectorAll('.copiar-link').forEach((boton) => {
    boton.addEventListener('click', async () => {
        await navigator.clipboard.writeText(boton.dataset.link);
        const texto = boton.textContent;
        boton.textContent = '¡Copiado!';
        setTimeout(() => boton.textContent = texto, 1500);
    });
});
</script>
</body>
</html>
